name: gisthunt
description: "A cross-platform client for browsing, searching, and editing your GitHub gists."
publish_to: 'none'

version: 2.1.3+14

environment:
  sdk: ^3.7.0-74.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  time_since: ^1.0.1
  shared_preferences: ^2.3.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_web_auth_2: ^4.0.1
  intl: ^0.20.2
  launch_at_startup: ^0.3.1
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  share_plus: ^10.0.3
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  file_selector: ^1.0.3
  flutter_markdown: ^0.7.4+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  # GitHub OAuth credentials, loaded at runtime by flutter_dotenv.
  # Copy .env.example to .env before building.
  assets:
    - .env

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
